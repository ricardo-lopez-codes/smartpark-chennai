version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartpark-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./smartpark.db
      - JWT_SECRET=supersecretjwtkeyforsmartparkchennai2026
      - DEMO_MODE=true
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - backend_data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartpark-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
